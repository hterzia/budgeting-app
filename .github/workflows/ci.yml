name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install without lifecycle scripts: the root `postinstall`
      # (electron-builder install-app-deps) rebuilds native modules against the
      # Electron ABI, which the Node-based build/test steps below don't want.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Rebuild better-sqlite3 (the SQLite store the backend tests use) for the
      # Node ABI. Tests run on SQLite with no external database service.
      - name: Build native modules
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      # Unit + component tests (184). The local-embedding integration test is
      # excluded here: it loads the native ONNX runtime and downloads a model,
      # which is fragile on hosted runners — run that one locally instead.
      - name: Test
        run: |
          npm run test -w frontend
          npm run test -w backend -- --exclude '**/localEmbeddings.test.ts'
