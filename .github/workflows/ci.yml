name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install without lifecycle scripts: the root `postinstall`
      # (electron-builder install-app-deps) rebuilds native modules against the
      # Electron ABI, which the Node-based build/test steps below don't want.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Rebuild the one native dependency the backend tests use (SQLite), for
      # the Node ABI. Tests run fully on SQLite + a local embedding model, so no
      # external database service is required.
      - name: Build native modules
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
