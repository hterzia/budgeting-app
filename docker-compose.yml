version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-budgeting}
      - POSTGRES_USER=${POSTGRES_USER:-budgeting}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - EMBEDDING_ENDPOINT=${EMBEDDING_ENDPOINT:-http://localhost:8001/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nvidia/llama-embed-nemotron-8b}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://localhost:8001/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-budgeting}
      - POSTGRES_USER=${POSTGRES_USER:-budgeting}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budgeting} -d ${POSTGRES_DB:-budgeting}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: